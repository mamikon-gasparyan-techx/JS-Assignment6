<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 6</title>
  </head>
  <body>
    <form
      id="task1"
      style="display: flex; flex-direction: column; align-items: center"
    >
      <input type="text" id="name" name="name" /><br />
      <label for="name">Name</label><br />
      <input type="email" id="mail" name="mail" /><br />
      <label for="mail">E-Mail</label><br />
      <button type="button" id="button1">Click me!</button><br />
    </form>
    <form
      id="task2"
      style="display: flex; flex-direction: column; align-items: center"
    >
      <textarea id="text" name="text"></textarea><br />
      <label for="text">Text</label><br />
      <button type="button" id="button2">Save note</button><br />
    </form>
    <div
      id="task3"
      style="display: flex; flex-direction: column; align-items: center"
    >
      <p id="cookies">Cookies</p>
      <button type="button" id="button3">Accept</button><br />
    </div>
    <div style="display: flex; flex-direction: column; align-items: center">
      <button type="button" id="button4">Clear all</button><br /><br /><br />
      <button type="button" id="button5">Get a Joke!</button><br />
      <div id="joke"></div>
      <br />
      <button type="button" id="button6">Start countdown</button>
      <p id="countdown">5</p>
      <br />
      <div style="display: flex; flex-direction: row; gap:10px;">
        <button type="button" id="button7">Start ticking!</button>
        <button type="button" id="button8">Stop ticking!</button><br />
      </div>
      <p id="tick">Tick</p>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
